# Checks only — nothing is built or deployed here; GitHub Pages keeps serving `main` directly.
name: CI

on:
  push:
  pull_request:

jobs:
  check:
    name: Syntax + consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 2 # HEAD~1 for the APP_VERSION bump check
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node tools/check.mjs --version-check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install ESLint (outside the repo — no package.json here)
        run: mkdir -p /tmp/eslint && cd /tmp/eslint && npm init -y > /dev/null && npm install eslint@10.12.0 eslint-plugin-html@8.2.1 globals@17.13.0 --no-audit --no-fund
      - run: ESLINT_DIR=/tmp/eslint /tmp/eslint/node_modules/.bin/eslint -c tools/eslint.config.mjs .

  smoke:
    name: Smoke test (iPhone 11/13/14)
    needs: [check, lint]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install Puppeteer (bundled Chromium)
        run: mkdir -p /tmp/pptr && cd /tmp/pptr && npm init -y > /dev/null && npm install puppeteer --no-audit --no-fund
      - name: Serve the repo
        run: python3 -m http.server 8123 > /dev/null 2>&1 &
      - run: PUPPETEER_DIR=/tmp/pptr node tools/smoke-test.mjs http://localhost:8123/
