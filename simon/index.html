<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black"/>
  <meta name="apple-mobile-web-app-title" content="Simon"/>
  <meta name="theme-color" content="#0b0c0f"/>
  <title>Simon</title>
  <link rel="stylesheet" href="../shared/common.css"/>

  <style>
    #new-btn { margin-left: auto; }
    #help-btn { margin-left: 0; }

    .status-row { display: flex; gap: var(--space-3); }
    .badge-row { text-align: center; font-size: var(--font-xs); color: var(--accent); font-weight: 600; min-height: 16px; }

    /* Same "measure the actual laid-out space in JS" board-sizing pattern as Reversi/Checkers/
       Battleship (see CLAUDE.md) — .board-wrap is a flex-1 box filling whatever space is actually
       left, sizeBoard() then fits the always-1:1 board into that measured box directly. */
    .board-wrap { display: flex; justify-content: center; align-items: center; flex: 1; min-height: 0; overflow: hidden; }
    /* Board visuals match a reference build the user supplied directly (a standalone HTML/CSS demo
       of the four-pad-plus-ring layout) — proportions/gradients/shadows below are that demo's own
       values, only converted from its fixed 512px mockup into percentages so they scale with
       sizeBoard()'s dynamically-measured frame size, and mapped onto our existing pad-0..pad-3
       ids/game-state instead of that demo's standalone markup. */
    .board-frame { position: relative; aspect-ratio: 1 / 1; background: #0a0a0a; box-shadow: 0 10px 25px rgba(0,0,0,0.35); }
    .simon-board { position: relative; width: 100%; height: 100%; }
    /* Each pad is absolutely positioned at a 4%-from-edge inset, 44% of the board square — leaving
       an 8%-wide plain black cross between all four (4% margin + 4% margin, no separate gap need). */
    .simon-pad {
      position: absolute;
      width: 44%;
      height: 44%;
      border: none;
      border-radius: 5%;
      box-shadow: inset 0 8px 18px rgba(255,255,255,0.45), inset 0 -20px 30px rgba(0,0,0,0.35), 0 4px 0 rgba(0,0,0,0.4);
      transition: transform 0.06s ease-out, box-shadow 0.06s ease-out, filter 0.15s ease-out;
    }
    .simon-pad.disabled { pointer-events: none; }
    /* .active (flashPad() toggles this for both sequence playback and the player's own tap
       feedback, so both read identically) sinks the pad in and brightens it — the demo calls this
       "pressed", renamed here to match the rest of this file's existing class name. */
    .simon-pad.active {
      transform: scale(0.96) translateY(3px);
      box-shadow: inset 0 4px 10px rgba(255,255,255,0.25), inset 0 -6px 14px rgba(0,0,0,0.45), 0 1px 0 rgba(0,0,0,0.4);
      filter: brightness(1.4) saturate(1.2);
    }
    .simon-pad.pad-0 { top: 4%; left: 4%; background: linear-gradient(160deg, #4CD964 0%, #2FAE4B 45%, #1E8A38 100%); }
    .simon-pad.pad-1 { top: 4%; right: 4%; background: linear-gradient(160deg, #FF6B5E 0%, #E8382B 45%, #C21F14 100%); }
    .simon-pad.pad-2 { bottom: 4%; left: 4%; background: linear-gradient(160deg, #5FA8F5 0%, #2E7CD6 45%, #1A5CAE 100%); }
    .simon-pad.pad-3 { bottom: 4%; right: 4%; background: linear-gradient(160deg, #FFE066 0%, #F2C218 45%, #D9A400 100%); }

    /* Purely decorative center hub (pointer-events:none so taps pass through to whichever pad is
       underneath), nested exactly like the reference demo: .simon-center (the round black base) >
       .simon-ring (the conic-gradient color ring, stop angles matched to where each pad-N actually
       sits, with a plain-width black cross laid over it via ::before/::after — a straight bar, not
       a flared wedge, same as the gap between the pads themselves) > .simon-center-inner (the small
       solid disc that holds the live tap counter). */
    .simon-center { position: absolute; top: 50%; left: 50%; width: 42%; height: 42%; transform: translate(-50%, -50%); border-radius: 50%; background: #050505; box-shadow: 0 6px 14px rgba(0,0,0,0.5); display: flex; align-items: center; justify-content: center; pointer-events: none; }
    .simon-ring {
      position: relative;
      width: 85%;
      height: 85%;
      border-radius: 50%;
      overflow: hidden;
      display: flex;
      align-items: center;
      justify-content: center;
      background: conic-gradient(#FF6B5E 0deg 90deg, #FFE066 90deg 180deg, #5FA8F5 180deg 270deg, #4CD964 270deg 360deg);
    }
    .simon-ring::before, .simon-ring::after { content: ''; position: absolute; background: #050505; }
    .simon-ring::before { left: 0; right: 0; top: 50%; height: 11%; transform: translateY(-50%); }
    .simon-ring::after { top: 0; bottom: 0; left: 50%; width: 11%; transform: translateX(-50%); }
    .simon-center-inner {
      position: relative;
      z-index: 1;
      width: 76%;
      height: 76%;
      border-radius: 50%;
      background: radial-gradient(circle at 50% 40%, #1c1c1c 0%, #050505 80%);
      box-shadow: inset 0 4px 10px rgba(255,255,255,0.08);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: var(--font-6xl);
      font-weight: 700;
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="topbar">
    <button class="icon-btn" id="back-btn" aria-label="Back">←</button>
    <h1><svg viewBox="0 0 4 4" xmlns="http://www.w3.org/2000/svg" style="width:20px;height:20px;vertical-align:-5px;margin-right:4px;"><rect x="0.1" y="0.1" width="1.7" height="1.7" rx="0.2" fill="#2FAE4B"/><rect x="2.2" y="0.1" width="1.7" height="1.7" rx="0.2" fill="#E8382B"/><rect x="0.1" y="2.2" width="1.7" height="1.7" rx="0.2" fill="#2E7CD6"/><rect x="2.2" y="2.2" width="1.7" height="1.7" rx="0.2" fill="#F2C218"/><circle cx="2" cy="2" r="0.62" fill="#0a0a0a"/></svg>Simon</h1>
    <button class="icon-btn" id="new-btn" aria-label="New">🔄</button>
    <button class="icon-btn" id="help-btn" aria-label="Help">❓</button>
  </div>

  <div class="status-row">
    <div class="panel-box">
      <div class="label" id="round-label">Runde</div>
      <div class="value" id="round-value">0</div>
    </div>
    <div class="panel-box">
      <div class="label" id="best-label">Bestwert</div>
      <div class="value" id="best-value">0</div>
    </div>
  </div>

  <div class="badge-row" id="badge-row"></div>

  <div class="board-wrap">
    <div class="board-frame">
      <div class="simon-board" id="simon-board">
        <button class="simon-pad pad-0" id="pad-0" aria-label="Green"></button>
        <button class="simon-pad pad-1" id="pad-1" aria-label="Red"></button>
        <button class="simon-pad pad-2" id="pad-2" aria-label="Blue"></button>
        <button class="simon-pad pad-3" id="pad-3" aria-label="Yellow"></button>
      </div>
      <div class="simon-center">
        <div class="simon-ring">
          <div class="simon-center-inner"><span id="center-round">0</span></div>
        </div>
      </div>
    </div>
  </div>

  <div class="confirm-row" id="confirm-row" style="display:none;">
    <span id="confirm-text">Neues Spiel starten? Fortschritt geht verloren.</span>
    <button class="btn-secondary" id="confirm-no">Nein</button>
    <button class="btn-danger" id="confirm-yes">Ja</button>
  </div>
  <div class="result-banner" id="result-banner" style="display:none;">
    <span class="result-text lose" id="result-text"></span>
    <button class="action-btn" id="result-new-btn">Neues Spiel</button>
  </div>

  <div class="overlay" id="start-overlay" style="display:flex;">
    <div class="box">
      <div class="title" id="start-title">Simon</div>
      <div class="stat" id="start-text">Merke dir die Farbfolge und tippe sie in der gleichen Reihenfolge nach.</div>
      <button class="action-btn" id="start-btn">Los geht's</button>
    </div>
  </div>

  <div class="overlay" id="help-overlay" style="display:none;">
    <div class="box">
      <div class="title" id="help-title">Wie wird gespielt?</div>
      <div class="stat" id="help-text" style="text-align:left; white-space:pre-line;"></div>
      <button class="action-btn" id="help-close-btn">Verstanden</button>
    </div>
  </div>

  <script src="../shared/common.js"></script>
  <script>
    // Simon: the game plays a growing sequence of colored/toned flashes; repeat it back exactly by
    // tapping the same pads in the same order. Get it right and one more step is appended to the
    // same sequence before it plays again from the start; get it wrong and the game ends. A
    // decades-old, genre-generic ruleset (like Checkers/Reversi elsewhere in this repo) —
    // everything here (the tones, pacing, pad layout) is original, not copied from any specific
    // published implementation or the real hardware's actual tone pitches.
    const STORAGE_KEY = 'simon_v1';

    // Fixed pacing — no difficulty tiers here: with the sequence itself always fully random and
    // growing every round regardless, a speed knob added little beyond what the growing sequence
    // length already provides on its own.
    const FLASH_MS = 420;
    const GAP_MS = 200;

    // One distinct tone per pad (a simple descending run, easy to tell apart — not a claim about
    // the real hardware's actual pitches).
    const PAD_FREQS = [392.0, 329.63, 196.0, 261.63];
    const PAUSE_BEFORE_NEXT_ROUND_MS = 700;
    const TAP_FEEDBACK_MS = 220;

    let state = { darkMode: true, lang: 'de', highScore: 0 };

    // ---------- i18n ----------

    const I18N = {
      de: {
        back: 'Zurück',
        new_game: 'Neu',
        confirm_new_game: 'Neues Spiel starten? Fortschritt geht verloren.',
        no: 'Nein', yes: 'Ja',
        round_label: 'Runde', best_label: 'Bestwert',
        watch: 'Merken …', your_turn: 'Du bist dran!', round_complete: 'Richtig!',
        game_over: '💀 Game Over', rounds_reached: 'Erreichte Runde',
        new_game_btn: 'Neues Spiel',
        start_title: 'Simon',
        start_text: 'Merke dir die Farbfolge und tippe sie in der gleichen Reihenfolge nach.',
        start_btn: 'Los geht\'s',
        help: 'Hilfe',
        help_title: 'Wie wird gespielt?',
        help_text: 'Simon spielt eine Farbfolge vor — schau und hör genau hin.\n\nTippe danach die gleichen Farben in der gleichen Reihenfolge nach.\n\nGelingt dir das, wird die Folge um eine weitere Farbe länger und beginnt von vorn.\n\nEin falscher Tipp beendet das Spiel — dann siehst du, welche Runde du erreicht hast.',
        help_close: 'Verstanden',
      },
      en: {
        back: 'Back',
        new_game: 'New',
        confirm_new_game: 'Start a new game? Progress will be lost.',
        no: 'No', yes: 'Yes',
        round_label: 'Round', best_label: 'Best',
        watch: 'Watch …', your_turn: 'Your turn!', round_complete: 'Correct!',
        game_over: '💀 Game Over', rounds_reached: 'Rounds reached',
        new_game_btn: 'New game',
        start_title: 'Simon',
        start_text: 'Remember the color sequence, then tap it back in the same order.',
        start_btn: 'Let\'s go',
        help: 'Help',
        help_title: 'How to play',
        help_text: 'Simon plays a sequence of colors — watch and listen closely.\n\nThen tap back the same colors in the same order.\n\nGet it right and the sequence grows by one more color and plays again from the start.\n\nA wrong tap ends the game — you\'ll see which round you reached.',
        help_close: 'Got it',
      },
    };
    function t(key) { return (I18N[state.lang] && I18N[state.lang][key]) || I18N.de[key] || sharedT(key) || key; }

    function load() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const p = JSON.parse(raw);
          if (typeof p.darkMode === 'boolean') state.darkMode = p.darkMode;
          if (typeof p.lang === 'string') state.lang = p.lang;
          if (typeof p.highScore === 'number') state.highScore = p.highScore;
        }
      } catch {}
    }
    function save() {
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
    }

    // ---------- Audio ----------

    // Has to be created (or resumed) synchronously inside the start-overlay's own click handler —
    // iOS Safari can permanently suspend an AudioContext created after an `await`/timeout, since
    // by then the user-gesture window has already closed. See balloon-blow/index.html in this
    // repo for the same pattern applied to getUserMedia instead.
    let audioCtx = null;
    function ensureAudio() {
      try {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        else if (audioCtx.state === 'suspended') audioCtx.resume();
      } catch {}
    }
    function playTone(freq, durationMs) {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'sine';
      osc.frequency.value = freq;
      const now = audioCtx.currentTime;
      gain.gain.setValueAtTime(0.0001, now);
      gain.gain.exponentialRampToValueAtTime(0.25, now + 0.02);
      gain.gain.exponentialRampToValueAtTime(0.0001, now + durationMs / 1000);
      osc.connect(gain).connect(audioCtx.destination);
      osc.start(now);
      osc.stop(now + durationMs / 1000 + 0.03);
    }

    // ---------- Game state ----------

    let sequence, playerIndex, round, phase, padEls;
    // The center display's own live counter — separate from `round` (the panel-box's "how long is
    // the sequence" stat, fixed for the whole round). tapCount instead counts up from 1 with every
    // single flash during playback, resets, then counts up again from 1 with every correct tap
    // during input — "how far along the current pass through the sequence are we", shown in both
    // the preview and the replay alike.
    let tapCount = 0;

    function updateCenter() {
      document.getElementById('center-round').textContent = tapCount;
    }

    function newGame() {
      sequence = [];
      playerIndex = 0;
      round = 0;
      tapCount = 0;
      phase = 'idle';
      document.getElementById('badge-row').textContent = '';
      document.getElementById('result-banner').style.display = 'none';
      document.getElementById('new-btn').style.display = 'flex';
      renderStats();
      updateCenter();
      setPadsDisabled(true);
      setTimeout(nextRound, 400);
    }

    function nextRound() {
      sequence.push(Math.floor(Math.random() * padEls.length));
      round = sequence.length;
      tapCount = 0;
      phase = 'playing';
      renderStats();
      updateCenter();
      setPadsDisabled(true);
      document.getElementById('badge-row').textContent = t('watch');
      setTimeout(() => playSequenceFrom(0), 500);
    }

    function playSequenceFrom(index) {
      if (index >= sequence.length) {
        phase = 'input';
        playerIndex = 0;
        tapCount = 0;
        updateCenter();
        setPadsDisabled(false);
        document.getElementById('badge-row').textContent = t('your_turn');
        return;
      }
      tapCount = index + 1;
      updateCenter();
      flashPad(sequence[index], FLASH_MS);
      setTimeout(() => playSequenceFrom(index + 1), FLASH_MS + GAP_MS);
    }

    function flashPad(padIdx, durationMs) {
      const el = padEls[padIdx];
      el.classList.add('active');
      playTone(PAD_FREQS[padIdx], durationMs);
      setTimeout(() => el.classList.remove('active'), durationMs);
    }

    function setPadsDisabled(disabled) {
      for (const el of padEls) el.classList.toggle('disabled', disabled);
    }

    // Reuses flashPad() itself (not a separate press/release-driven class toggle) so a self-tapped
    // pad flashes for the exact same fixed duration the preview uses — gating the clear on the
    // real touchend instead made a quick tap's flash feel shorter/flickerier than the preview's
    // steady glow, even though the underlying .active CSS was identical either way.
    function pressPad(padIdx) {
      if (phase !== 'input') return;
      flashPad(padIdx, TAP_FEEDBACK_MS);
      onPadTap(padIdx);
    }

    // Fires immediately on press (touchstart/mousedown, via pressPad() below), not on release like
    // a plain .onclick would — a real Simon lights up and sounds the instant a finger touches the
    // pad, not after a full press-then-lift cycle completes, and waiting for that full cycle read
    // as noticeably laggier.
    function onPadTap(padIdx) {
      if (phase !== 'input') return;
      if (padIdx === sequence[playerIndex]) {
        playerIndex++;
        tapCount = playerIndex;
        updateCenter();
        if (playerIndex === sequence.length) {
          if (round > state.highScore) { state.highScore = round; save(); }
          phase = 'roundcomplete';
          setPadsDisabled(true);
          renderStats();
          document.getElementById('badge-row').textContent = t('round_complete');
          setTimeout(nextRound, PAUSE_BEFORE_NEXT_ROUND_MS);
        }
      } else {
        endGame();
      }
    }

    function endGame() {
      phase = 'gameover';
      setPadsDisabled(true);
      const reached = Math.max(0, round - 1);
      document.getElementById('badge-row').textContent = '';
      document.getElementById('result-text').textContent = t('game_over') + ' · ' + t('rounds_reached') + ': ' + reached;
      document.getElementById('new-btn').style.display = 'none';
      document.getElementById('result-banner').style.display = 'flex';
      renderStats();
      sizeBoard();
    }

    // ---------- Rendering ----------

    function sizeBoard() {
      const wrap = document.querySelector('.board-wrap');
      const frame = document.querySelector('.board-frame');
      const size = Math.max(0, Math.min(wrap.clientWidth, wrap.clientHeight));
      frame.style.width = size + 'px';
      frame.style.height = size + 'px';
    }

    function renderStats() {
      document.getElementById('round-value').textContent = round;
      document.getElementById('best-value').textContent = state.highScore;
    }

    // ---------- i18n wiring ----------

    function applyLang() {
      document.documentElement.lang = state.lang;
      document.getElementById('back-btn').setAttribute('aria-label', t('back'));
      document.getElementById('new-btn').setAttribute('aria-label', t('new_game'));
      document.getElementById('confirm-text').textContent = t('confirm_new_game');
      document.getElementById('confirm-no').textContent = t('no');
      document.getElementById('confirm-yes').textContent = t('yes');
      document.getElementById('result-new-btn').textContent = t('new_game_btn');
      document.getElementById('round-label').textContent = t('round_label');
      document.getElementById('best-label').textContent = t('best_label');
      document.getElementById('start-title').textContent = t('start_title');
      document.getElementById('start-text').textContent = t('start_text');
      document.getElementById('start-btn').textContent = t('start_btn');
      document.getElementById('help-btn').setAttribute('aria-label', t('help'));
      document.getElementById('help-title').textContent = t('help_title');
      document.getElementById('help-text').textContent = t('help_text');
      document.getElementById('help-close-btn').textContent = t('help_close');
      if (phase === 'gameover') {
        const reached = Math.max(0, round - 1);
        document.getElementById('result-text').textContent = t('game_over') + ' · ' + t('rounds_reached') + ': ' + reached;
      }
    }

    // ---------- Wiring ----------

    document.getElementById('back-btn').onclick = () => { location.href = '../index.html'; };
    padEls = [0, 1, 2, 3].map(i => document.getElementById('pad-' + i));
    padEls.forEach((el, i) => {
      el.addEventListener('touchstart', (e) => { e.preventDefault(); pressPad(i); }, { passive: false });
      el.addEventListener('mousedown', () => pressPad(i));
    });

    document.getElementById('start-btn').onclick = () => {
      ensureAudio();
      document.getElementById('start-overlay').style.display = 'none';
      newGame();
    };
    document.getElementById('help-btn').onclick = () => { document.getElementById('help-overlay').style.display = 'flex'; };
    document.getElementById('help-close-btn').onclick = () => { document.getElementById('help-overlay').style.display = 'none'; };

    // Confirm-before-destructive-action: "New" discards the running game — same pattern as
    // Reversi/Checkers/Mastermind in this repo.
    function askNewGame() {
      document.getElementById('result-banner').style.display = 'none';
      document.getElementById('new-btn').style.display = 'none';
      document.getElementById('confirm-row').style.display = 'flex';
      sizeBoard();
    }
    function closeConfirm() {
      document.getElementById('confirm-row').style.display = 'none';
      if (phase === 'gameover') document.getElementById('result-banner').style.display = 'flex';
      else document.getElementById('new-btn').style.display = 'flex';
      sizeBoard();
    }
    document.getElementById('new-btn').onclick = askNewGame;
    document.getElementById('confirm-no').onclick = closeConfirm;
    document.getElementById('confirm-yes').onclick = () => {
      closeConfirm();
      newGame();
    };
    document.getElementById('result-new-btn').onclick = () => newGame();
    window.addEventListener('resize', sizeBoard);

    function init() {
      load();
      loadShellPrefs();
      applyTheme();
      phase = 'idle';
      round = 0;
      renderStats();
      setPadsDisabled(true);
      applyLang();
      sizeBoard();
    }

    init();
  </script>
</body>
</html>
